[package]
name = "couchfusion-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "CouchFusion control plane (Phase 1 MVP): dev sessions, component delete/generate, git."
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "tokio", "query", "json"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
nix = { version = "0.31", features = ["fs", "signal", "process", "user"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
