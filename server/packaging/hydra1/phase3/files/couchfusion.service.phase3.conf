# /etc/systemd/system/couchfusion.service.d/30-phase3.conf — the control plane (cfcp) writes
# build snapshots and production releases (spec §7.2). The base unit made /var/www inaccessible;
# reset that list and keep everything else hidden.
[Service]
InaccessiblePaths=
InaccessiblePaths=-/etc/caddy -/var/lib/cfagent -/etc/couchfusion/env
ReadWritePaths=/var/cache/cf-build /var/www/radustanciu
