# /etc/tmpfiles.d/couchfusion.conf
d /run/couchfusion          0755 cfcp cfcp -
# 2710 cfcp:cfdev: the dev server (cfdev) may stat files here (the agent marker) but not list
# them; setgid makes new files group cfdev. The env file stays 0600 cfcp (read by systemd only).
d /run/couchfusion/dev      2710 cfcp cfdev -
d /run/couchfusion/agent    0755 cfcp cfcp -
d /var/lib/couchfusion           0750 cfcp cfcp -
d /var/lib/couchfusion/agent-out 0700 cfcp cfcp -
d /var/lib/couchfusion/trash     0700 cfcp cfcp -
# Phase 3: build snapshots (cfcp writes, cfdev builds; group cfsrc, setgid) and releases.
d /var/cache/cf-build                  0755 root cfsrc -
d /var/cache/cf-build/radustanciu      2770 cfcp cfsrc -
d /var/www                             0755 root root  -
d /var/www/radustanciu                 2750 cfcp cf-site-radustanciu -
d /var/www/radustanciu/releases        2750 cfcp cf-site-radustanciu -
