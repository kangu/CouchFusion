# /etc/couchfusion/server.toml — CouchFusion control plane on hetzner1 (Phase 1).
# Owner root:cfcp 0640. No secrets live here.

[server]
state_dir = "/var/lib/couchfusion"
run_dir = "/run/couchfusion"
spa_dir = "/opt/couchfusion/current/web"
public_host = "hetzner1.tailb7471b.ts.net"
control_port = 9180
runner = "systemd"
unix_listeners = true   # tailscale serve --https=P unix:/run/couchfusion/ts-P.sock
tcp_listeners = true    # 127.0.0.1:P for the SSH tunnel (cookie via `couchfusion-server login-url`)
dev_ready_timeout_secs = 180
registry_timeout_secs = 15

[auth]
allowed_logins = ["r67rggkzzb@privaterelay.appleid.com"]

[workspace]
id = "hetzner1"
name = "hetzner1"
root = "/srv/couchfusion/workspace"
repos = ["apps/radustanciu", "layers", "cli-content"]

[toolchain]
bun = "/opt/couchfusion/toolchain/bin/bun"
git = "/usr/bin/git"
systemctl = "/usr/bin/systemctl"
journalctl = "/usr/bin/journalctl"
codex = "/opt/couchfusion/toolchain/bin/codex"

[[sites]]
id = "radustanciu"
slot_port = 9181
dev_port = 4401
dev_unit = "cf-dev@radustanciu.service"
agent_unit = "cf-agent@radustanciu.service"
